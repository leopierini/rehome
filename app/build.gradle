plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.leopierini.rehome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist
        // (Xiaomi: com.ts.launcher; ColorOS TV: com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('io.github.leopierini.rehome')
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        // English, with Italian as the only translation (AndroidX's own languages left out too).
        resConfigs 'en', 'it'
    }

    signingConfigs {
        // The release key from the REHOME_* properties (see the root build.gradle); none set: the debug key.
        def key = rootProject.releaseKey()
        if (key != null) {
            release {
                storeFile key.storeFile
                storePassword key.storePassword
                keyAlias key.keyAlias
                keyPassword key.keyPassword
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // The local release key when configured, the debug key otherwise (see signingConfigs).
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // The real org.json for JVM tests (android.jar's is a stub): CitySearch parses Open-Meteo's answer with it.
    testImplementation 'org.json:json:20231013'
}
